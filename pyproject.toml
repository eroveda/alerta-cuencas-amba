[project]
name = "alertas-amba"
version = "0.1.0"
description = "Sistema de alertas tempranas de inundación para el AMBA (Fase 0: monitoreo)"
requires-python = ">=3.12"
dependencies = ["shapely>=2.0", "defusedxml>=0.7"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["alertas"]
