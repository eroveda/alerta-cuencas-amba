# Monitoreo 24/7 sin depender de la PC local: cada 10 minutos consulta las fuentes,
# arma estado.json y serie.json, y publica la web en GitHub Pages.
# La base SQLite (historia de 30 días) se conserva entre corridas con el caché de Actions.
# Ojo: GitHub demora los cron hasta ~15 min en horas pico y los desactiva tras
# 60 días sin commits en el repo.
name: monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["web/**", "alertas/**", ".github/workflows/monitor.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  poll-y-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: uv sync --frozen --no-dev

      - name: Recuperar base de datos
        uses: actions/cache/restore@v4
        with:
          path: data/alertas.sqlite
          key: alertas-db-${{ github.run_id }}
          restore-keys: alertas-db-

      - name: Consultar fuentes
        run: |
          mkdir -p data
          uv run --no-dev python -m alertas.cli poll

      - name: Guardar base de datos
        if: always() && hashFiles('data/alertas.sqlite') != ''
        uses: actions/cache/save@v4
        with:
          path: data/alertas.sqlite
          key: alertas-db-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
